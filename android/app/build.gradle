plugins { id 'com.android.application' }

android {
    namespace 'dev.btstudio.solarsystem'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.btstudio.solarsystem'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.0.0'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            debuggable true
        }
        release {
            minifyEnabled false
            // Store signing is intentionally not configured. Never commit signing keys.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
